name: 原油化工 24 小时双小时行情与情报推送 (24/7)

on:
  schedule:
    # 避开全球整点 00 分的严重排队高峰 (GitHub 官方推荐错峰设置)
    # 每小时第 10 分钟自动巡检 (UTC: 10 * * * *)
    # 结合代码内动态检测（离上次推送满 90 分钟才触发），自动实现全天每 2 小时准时推送
    # 优势：就算某一次遭遇 GitHub 云端偶发性排队延迟，也会在下一个小时立即自动补发，彻底消除漏发
    - cron: '10 * * * *'

  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮立即测试触发
    inputs:
      force:
        description: '是否强制重新生成与推送 (忽略防重)'
        required: false
        default: false
        type: boolean

jobs:
  oil-news-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行原油化工双小时研报生成与推送脚本
        env:
          NTFY_TOPIC_OIL: ${{ secrets.NTFY_TOPIC_OIL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python main_oil.py ${{ inputs.force && '--force' || '' }}

      - name: 归档原油研报至 Actions Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oil-news-report
          path: oil_report_*.md
          retention-days: 7
