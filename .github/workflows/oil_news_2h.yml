name: 原油化工每日早报行情与情报推送 (晨报版)

on:
  schedule:
    # 国际标准时间 UTC 23:00 对应北京时间 07:00 (早间主波次)
    # 附加 UTC 23:45 (北京时间 07:45) 作为防漏容灾二次兜底波次（代码自带当日防重，成功后不会重复推送）
    - cron: '0 23 * * *'   # 北京时间 07:00 (早间主波次)
    - cron: '45 23 * * *'  # 北京时间 07:45 (早间容灾兜底)

  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮立即测试触发
    inputs:
      force:
        description: '是否强制重新生成与推送 (忽略防重)'
        required: false
        default: false
        type: boolean

jobs:
  oil-news-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行原油化工双小时研报生成与推送脚本
        env:
          NTFY_TOPIC_OIL: ${{ secrets.NTFY_TOPIC_OIL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python main_oil.py ${{ inputs.force && '--force' || '' }}

      - name: 归档原油研报至 Actions Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oil-news-report
          path: oil_report_*.md
          retention-days: 7
